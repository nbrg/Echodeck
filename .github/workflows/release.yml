name: release

# Builds a single self-contained Echodeck.exe on Windows and publishes it as a GitHub Release.
#
# Two ways to cut a release:
#   * push a tag:   git tag v0.2.0 && git push origin v0.2.0
#   * or run it by hand: Actions → release → Run workflow → enter a version (e.g. 0.2.0-preview.1)
# Versions containing a "-" (0.2.0-preview.1) are marked as pre-releases.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v (e.g. 0.1.0-preview.1)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Determine version
        id: version
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') { $v = '${{ inputs.version }}' }
          else { $v = '${{ github.ref_name }}'.TrimStart('v') }
          $v = $v.Trim().TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Invalid version '$v' (expected e.g. 0.2.0 or 0.2.0-preview.1)" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "prerelease=$($v.Contains('-').ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test tests/Echodeck.Core.Tests --configuration Release

      - name: Publish
        # A normal self-contained folder (not single-file): Velopack installs it under
        # %LocalAppData%\Echodeck and ships small delta updates between versions.
        run: dotnet publish src/Echodeck.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:Version=${{ steps.version.outputs.version }} -o publish

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Fetch previous release (for delta updates)
        # Older Echodeck releases have no Velopack packages; that's fine, we then ship a full package only.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --pre --token $env:GH_TOKEN -o releases

      - name: Package installer + update
        run: >
          vpk pack --packId Echodeck --packVersion ${{ steps.version.outputs.version }}
          --packDir publish --mainExe Echodeck.exe --packTitle Echodeck --packAuthors Echodeck
          --icon src/Echodeck.App/Assets/echodeck.ico --outputDir releases

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $tag = "v$v"
          $notes = @"
          ## Install (first time) — or just let Echodeck update itself

          1. Download **Echodeck-win-Setup.exe** below and run it. Echodeck installs for your user (no admin), adds Start menu and desktop shortcuts, and starts.
          2. From then on Echodeck **updates itself**: new versions download in the background and install when you click *Settings → Restart to update* or quit Echodeck. No more separate downloads.
          3. Windows SmartScreen may say "Windows protected your PC" because the installer isn't code-signed yet: click **More info → Run anyway**.

          Coming from an older Echodeck exe? Install once with the Setup file and delete the old exe(s). Your clips and settings (``%AppData%\Echodeck``) are kept.
          Prefer no install? Use **Echodeck-win-Portable.zip** (doesn't auto-update).

          Requirements: 64-bit Windows 10 version 2004+ or Windows 11, Discord desktop app, [VB-CABLE](https://vb-audio.com/Cable/).

          Test checklist: [docs/TESTING.md](https://github.com/${{ github.repository }}/blob/$tag/docs/TESTING.md)
          "@
          $notes | Out-File -Encoding utf8 notes.md

          # Upload only this version's files (vpk download may have fetched older packages for deltas).
          $assets = Get-ChildItem releases -File | Where-Object {
            $_.Name -like '*Setup.exe' -or $_.Name -like '*Portable.zip' -or $_.Name -like "*$v*" -or
            $_.Name -eq 'RELEASES' -or $_.Name -like 'releases.*.json' -or $_.Name -like 'assets.*.json'
          } | ForEach-Object { $_.FullName }
          Write-Host "Uploading:"; $assets | ForEach-Object { Write-Host "  $_" }

          $ghArgs = @($tag) + $assets + @('--title', "Echodeck $v", '--notes-file', 'notes.md', '--target', '${{ github.sha }}')
          if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { $ghArgs += '--prerelease' }
          gh release create @ghArgs
