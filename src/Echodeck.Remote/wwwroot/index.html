<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1e1f22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Echodeck">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="/icon.png">
<title>Echodeck</title>
<style>
  :root {
    --bg: #1e1f22; --panel: #2b2d31; --tile: #313338; --tile-active: #4752c4;
    --text: #f2f3f5; --muted: #a0a4ab; --accent: #5865f2; --danger: #da373c; --ok: #23a55a; --sel: rgba(88,101,242,.28);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 12px); user-select: none; -webkit-user-select: none; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 10px 0 8px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; }
  .title { font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--ok); } .dot.off { background: var(--danger); }
  .status { color: var(--muted); font-size: 13px; }
  button { font: inherit; color: var(--text); border: 0; border-radius: 12px; background: var(--panel);
    padding: 12px 14px; cursor: pointer; touch-action: manipulation; }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: .5; }
  .primary { background: var(--accent); font-weight: 600; }
  .danger { background: var(--danger); }
  .save { flex: 1; padding: 16px 8px; }
  .mute.muted { background: var(--danger); }
  .controls { margin-top: 10px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; margin: 10px 0 4px; padding-bottom: 4px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 8px 12px; border-radius: 999px; font-size: 14px; background: var(--panel); color: var(--muted); }
  .chip.sel { background: var(--text); color: var(--bg); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 8px; }
  .tile { position: relative; min-height: 88px; text-align: left; background: var(--tile); display: flex; flex-direction: column;
    justify-content: space-between; padding: 12px 44px 12px 12px; border-radius: 14px; word-break: break-word; transition: background 0.4s; }
  .tile .name { font-weight: 600; }
  .tile .meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .tile.flash { background: var(--tile-active); transition: none; }
  .tile .edit { position: absolute; top: 6px; right: 6px; padding: 8px 9px; border-radius: 10px; background: rgba(255,255,255,.08); font-size: 15px; }
  .empty, .error { color: var(--muted); text-align: center; padding: 40px 16px; }
  .error h2 { color: var(--text); }
  #toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 16px); transform: translateX(-50%);
    background: var(--panel); padding: 10px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity 0.2s;
    pointer-events: none; max-width: 90vw; text-align: center; z-index: 10; }
  #toast.show { opacity: 1; }

  /* trim editor */
  #editor { display: none; padding-top: 10px; }
  body.editing #editor { display: block; }
  body.editing #board { display: none; }
  #name { width: 100%; font: inherit; font-size: 17px; color: var(--text); background: var(--panel); border: 0; border-radius: 10px; padding: 12px; user-select: text; -webkit-user-select: text; }
  #wave { width: 100%; height: 170px; display: block; margin-top: 12px; border-radius: 12px; background: #111214; touch-action: none; }
  .sel-text { color: var(--muted); font-size: 14px; margin: 8px 0; text-align: center; }
  .nudge { display: grid; grid-template-columns: auto 1fr 1fr auto 1fr 1fr; gap: 6px; align-items: center; }
  .nudge span { color: var(--muted); font-size: 13px; padding: 0 2px 0 4px; }
  .nudge button { padding: 10px 2px; font-size: 14px; }
  .actions-label { color: var(--muted); font-size: 13px; margin: 14px 0 -4px; }
  .playing { background: var(--accent); font-weight: 600; }
  .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .actions button { padding: 14px 6px; font-size: 15px; }
  .hint { color: var(--muted); font-size: 12px; text-align: center; margin-top: 10px; }
</style>
</head>
<body>
<header>
  <div class="row">
    <button id="back" style="display:none">← Back</button>
    <div class="title grow"><span id="dot" class="dot"></span><span id="heading">Echodeck</span></div>
    <button id="mute" class="mute">🎤 Mic on</button>
    <button id="stop">■ Stop</button>
  </div>
  <div id="status" class="status">Connecting…</div>
</header>

<section id="board">
  <div id="saves" class="row controls"></div>
  <div id="chips" class="chips"></div>
  <main id="main"><div class="empty">Loading clips…</div></main>
</section>

<section id="editor">
  <input id="name" type="text" maxlength="120" autocomplete="off" placeholder="Clip name">
  <canvas id="wave"></canvas>
  <div id="seltext" class="sel-text"></div>
  <div class="nudge">
    <span>Start</span><button data-n="s,-0.1">−0.1 s</button><button data-n="s,0.1">+0.1 s</button>
    <span>End</span><button data-n="e,-0.1">−0.1 s</button><button data-n="e,0.1">+0.1 s</button>
  </div>
  <div class="actions-label">Listen to the selection</div>
  <div class="actions">
    <button id="pvPhone">🔈 This phone</button>
    <button id="pvPc">🎧 PC headset</button>
    <button id="pvDiscord">📢 Into Discord</button>
  </div>
  <div class="actions">
    <button id="saveTrim" class="primary">💾 Save</button>
    <button id="saveCopy">Save copy</button>
    <button id="del" class="danger">🗑 Delete</button>
  </div>
  <div class="hint">Drag the white handles (or tap the waveform to move the nearest one). “This phone” and “PC headset” are private previews — only “Into Discord” is heard by friends.</div>
</section>
<div id="toast"></div>

<script>
(() => {
  // ---------------------------------------------------------------- pairing + API
  const m = location.hash.match(/t=([0-9a-f]+)/i);
  if (m) { localStorage.setItem('echodeckToken', m[1]); history.replaceState(null, '', '/'); }
  const token = localStorage.getItem('echodeckToken') || '';
  const $ = id => document.getElementById(id);
  let paired = true;

  async function api(path, method = 'GET', body) {
    const opts = { method, headers: { 'X-Echodeck-Token': token }, cache: 'no-store' };
    if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
    const res = await fetch('/api' + path, opts);
    if (res.status === 401) { paired = false; showUnpaired(); throw new Error('unpaired'); }
    if (!res.ok) {
      let msg = 'HTTP ' + res.status;
      try { msg = (await res.json()).message || msg; } catch {}
      throw new Error(msg);
    }
    return res;
  }
  const json = async (path, method, body) => (await api(path, method, body)).json();

  function toast(text) {
    const t = $('toast'); t.textContent = text; t.classList.add('show');
    clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 2000);
  }
  const buzz = () => navigator.vibrate && navigator.vibrate(15);

  async function act(path, body) {
    buzz();
    try { const r = await json(path, 'POST', body); toast(r.message || 'Done'); refreshState(); return r; }
    catch (e) { if (paired) toast(e.message === 'Failed to fetch' ? 'Not connected to Echodeck' : e.message); return null; }
  }

  function showUnpaired() {
    document.body.classList.remove('editing');
    $('main').innerHTML = '<div class="error"><h2>Not paired</h2>Open Echodeck on your PC → <b>Phone</b> tab, ' +
      'then scan the QR code with this device\'s camera.</div>';
    $('status').textContent = 'Not paired';
    $('dot').className = 'dot off';
  }

  // ---------------------------------------------------------------- board (clip grid)
  let clips = [], libraryVersion = -1, saveChoices = '';
  let filter = localStorage.getItem('echodeckFilter') || '🕒';

  function renderChips() {
    const cats = [...new Set(clips.map(c => c.category).filter(Boolean))].sort((a, b) => a.localeCompare(b));
    const options = ['🕒', '★', 'All', ...cats];
    if (!options.includes(filter)) filter = '🕒';
    $('chips').innerHTML = '';
    for (const o of options) {
      const b = document.createElement('button');
      b.className = 'chip' + (o === filter ? ' sel' : '');
      b.textContent = o === '🕒' ? '🕒 Recent' : o === '★' ? '★ Favourites' : o;
      b.onclick = () => { filter = o; localStorage.setItem('echodeckFilter', o); renderChips(); renderClips(); };
      $('chips').appendChild(b);
    }
  }

  function shownClips() {
    if (filter === '🕒') return [...clips].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 40);
    const list = clips.filter(c => filter === 'All' || (filter === '★' ? c.favorite : c.category === filter));
    return list.sort((a, b) => (b.favorite - a.favorite) || a.name.localeCompare(b.name));
  }

  function renderClips() {
    const shown = shownClips();
    const main = $('main');
    if (shown.length === 0) {
      main.innerHTML = '<div class="empty">' + (clips.length === 0
        ? 'No clips yet — press 💾 Save above right after something funny happens.'
        : filter === '★' ? 'No favourites yet — star clips in Echodeck\'s Soundboard tab.' : 'Nothing here.') + '</div>';
      return;
    }
    const grid = document.createElement('div'); grid.className = 'grid';
    for (const c of shown) {
      const b = document.createElement('button'); b.className = 'tile';
      const name = document.createElement('div'); name.className = 'name'; name.textContent = (c.favorite ? '★ ' : '') + c.name;
      const meta = document.createElement('div'); meta.className = 'meta';
      meta.textContent = c.duration.toFixed(1) + ' s' + (c.category ? ' · ' + c.category : '');
      const edit = document.createElement('span'); edit.className = 'edit'; edit.textContent = '✂'; edit.setAttribute('role', 'button');
      edit.onclick = ev => { ev.stopPropagation(); openEditor(c.id); };
      b.append(name, meta, edit);
      b.onclick = () => {
        b.classList.add('flash'); setTimeout(() => b.classList.remove('flash'), 150);
        act('/clips/' + c.id + '/play');
      };
      grid.appendChild(b);
    }
    main.innerHTML = ''; main.appendChild(grid);
  }

  async function loadClips() {
    clips = await json('/clips');
    renderChips(); renderClips();
  }

  function renderSaves(choices) {
    const key = choices.join(',');
    if (key === saveChoices) return;
    saveChoices = key;
    $('saves').innerHTML = '';
    choices.forEach((sec, i) => {
      const b = document.createElement('button');
      b.className = 'save' + (i === 0 ? ' primary' : '');
      b.textContent = '💾 Save last ' + sec + ' s';
      b.onclick = async () => {
        const r = await act('/save/' + sec);
        if (r && r.ok && r.clipId) { await loadClips(); openEditor(r.clipId); }
      };
      $('saves').appendChild(b);
    });
  }

  async function refreshState() {
    try {
      const s = await json('/state');
      paired = true;
      $('dot').className = 'dot ' + (s.discordOutputActive ? 'on' : 'off');
      if (!document.body.classList.contains('editing'))
        $('status').textContent = s.discordOutputActive
          ? (s.clipPlaying ? 'Playing into Discord…' : s.captureActive ? 'Connected · recording replay buffer' : 'Connected · replay buffer not recording')
          : 'Echodeck is running, but its Discord output is inactive';
      $('mute').textContent = s.micMuted ? '🔇 Muted' : '🎤 Mic on';
      $('mute').classList.toggle('muted', s.micMuted);
      renderSaves(s.saveChoices);
      syncRemotePlaying(s);
      if (s.libraryVersion !== libraryVersion) { libraryVersion = s.libraryVersion; await loadClips(); }
    } catch (e) {
      if (paired) { $('dot').className = 'dot off'; $('status').textContent = 'Can\'t reach Echodeck — same Wi-Fi? Is it running?'; }
    }
  }

  // ---------------------------------------------------------------- trim editor
  const canvas = $('wave'), g = canvas.getContext('2d');
  let ed = null;            // { id, duration, peaks, start, end, playhead }
  let raf = 0;

  async function openEditor(id) {
    const clip = clips.find(c => c.id === id);
    document.body.classList.add('editing');
    $('back').style.display = ''; $('heading').textContent = 'Trim';
    $('name').value = clip ? clip.name : '';
    $('status').textContent = 'Loading waveform…';
    ed = null; draw();
    try {
      const buckets = Math.min(1200, Math.max(200, Math.round(canvas.clientWidth * (window.devicePixelRatio || 1))));
      const w = await json('/clips/' + id + '/waveform?buckets=' + buckets);
      ed = { id, duration: w.duration, peaks: w.peaks, start: 0, end: w.duration, playhead: -1 };
      setPlaying(null);
      preloadAudio(id).catch(() => {});
      $('status').textContent = 'Drag the handles to choose the part to keep';
      draw();
    } catch (e) { toast('Couldn\'t load clip: ' + e.message); closeEditor(); }
  }

  function closeEditor() {
    stopPhone();
    if (playing) setPlaying(null);
    document.body.classList.remove('editing');
    $('back').style.display = 'none'; $('heading').textContent = 'Echodeck';
    ed = null; refreshState();
  }

  function draw() {
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.clientWidth, H = canvas.clientHeight;
    if (canvas.width !== W * dpr) { canvas.width = W * dpr; canvas.height = H * dpr; }
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, W, H);
    if (!ed) { $('seltext').textContent = ''; return; }
    const x = t => (t / ed.duration) * W;
    const sx = x(ed.start), ex = x(ed.end), mid = H / 2;
    g.fillStyle = 'rgba(88,101,242,.22)'; g.fillRect(sx, 0, ex - sx, H);
    const n = ed.peaks.length;
    for (let i = 0; i < n; i++) {
      const px = (i / n) * W, h = Math.max(1, (ed.peaks[i] / 100) * (H - 16));
      g.fillStyle = (px >= sx && px <= ex) ? '#8b93ff' : '#5c5e66';
      g.fillRect(px, mid - h / 2, Math.max(1, W / n), h);
    }
    for (const hx of [sx, ex]) {
      g.fillStyle = '#fff'; g.fillRect(hx - 1.5, 0, 3, H);
      g.beginPath(); g.arc(hx, H - 14, 11, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.arc(hx, 14, 7, 0, Math.PI * 2); g.fill();
    }
    if (ed.playhead >= 0) { g.fillStyle = '#f0b232'; g.fillRect(x(ed.playhead) - 1, 0, 2, H); }
    $('seltext').textContent = 'Keep ' + (ed.end - ed.start).toFixed(2) + ' s  (' + ed.start.toFixed(2) + ' – ' + ed.end.toFixed(2) + ' of ' + ed.duration.toFixed(2) + ' s)';
  }

  // Touch / mouse: grab the nearer handle (or move it to where you tapped), then drag.
  let dragging = null;
  const timeAt = ev => { const r = canvas.getBoundingClientRect(); return Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width)) * ed.duration; };
  function setHandle(which, t) {
    const min = 0.05;
    if (which === 's') ed.start = Math.max(0, Math.min(t, ed.end - min));
    else ed.end = Math.min(ed.duration, Math.max(t, ed.start + min));
    draw();
  }
  canvas.addEventListener('pointerdown', ev => {
    if (!ed) return;
    canvas.setPointerCapture(ev.pointerId);
    const t = timeAt(ev);
    dragging = Math.abs(t - ed.start) <= Math.abs(t - ed.end) ? 's' : 'e';
    setHandle(dragging, t);
  });
  canvas.addEventListener('pointermove', ev => { if (ed && dragging) setHandle(dragging, timeAt(ev)); });
  const endDrag = () => { dragging = null; };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  window.addEventListener('resize', draw);

  document.querySelectorAll('[data-n]').forEach(b => b.onclick = () => {
    if (!ed) return;
    const [which, d] = b.dataset.n.split(',');
    setHandle(which, (which === 's' ? ed.start : ed.end) + parseFloat(d));
  });

  const range = () => ({ start: ed.start, end: ed.end });

  // Which preview is playing: 'phone' | 'pc' | 'discord' | null. The active button turns into "■ Stop".
  let playing = null, playingSince = 0;
  const labels = { phone: '🔈 This phone', pc: '🎧 PC headset', discord: '📢 Into Discord' };
  const buttons = { phone: $('pvPhone'), pc: $('pvPc'), discord: $('pvDiscord') };
  function setPlaying(kind) {
    playing = kind; playingSince = Date.now();
    for (const [k, b] of Object.entries(buttons)) {
      b.textContent = k === kind ? '■ Stop' : labels[k];
      b.classList.toggle('playing', k === kind);
    }
  }
  // PC/Discord playback ends on the PC: the state poll tells us (ignore the first moment after starting).
  function syncRemotePlaying(s) {
    if (Date.now() - playingSince < 1200) return;
    if ((playing === 'pc' && !s.previewPlaying) || (playing === 'discord' && !s.clipPlaying)) setPlaying(null);
  }

  $('pvPc').onclick = async () => {
    if (!ed) return;
    if (playing === 'pc') { await act('/stop'); setPlaying(null); return; }
    stopPhone();
    const r = await act('/clips/' + ed.id + '/preview-range', range());
    if (r && r.ok) setPlaying('pc');
  };
  $('pvDiscord').onclick = async () => {
    if (!ed) return;
    if (playing === 'discord') { await act('/stop'); setPlaying(null); return; }
    stopPhone();
    const r = await act('/clips/' + ed.id + '/play-range', range());
    if (r && r.ok) setPlaying('discord');
  };

  // Phone preview uses a normal <audio> element: unlike Web Audio it also plays when an iPhone's
  // ring/silent switch is on silent. The WAV is fetched as soon as the editor opens, so a tap
  // can start playback immediately (iOS only allows play() directly inside the tap).
  const player = new Audio();
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  let audioUrl = null, audioFor = null, audioReady = null;

  function preloadAudio(id) {
    if (audioFor === id && audioReady) return audioReady;
    audioFor = id;
    audioReady = (async () => {
      const blob = await (await api('/clips/' + id + '/audio')).blob();
      if (audioFor !== id) return;
      if (audioUrl) URL.revokeObjectURL(audioUrl);
      audioUrl = URL.createObjectURL(new Blob([blob], { type: 'audio/wav' }));
      player.src = audioUrl;
      await new Promise((ok, fail) => {
        player.onloadedmetadata = ok; player.onerror = () => fail(new Error('this browser can\'t play the clip'));
        player.load();
      });
    })();
    audioReady.catch(() => { audioReady = null; });
    return audioReady;
  }

  function stopPhone() {
    if (playing === 'phone') { player.pause(); setPlaying(null); }
    cancelAnimationFrame(raf);
    if (ed) { ed.playhead = -1; draw(); }
  }

  $('pvPhone').onclick = async () => {
    if (!ed) return;
    if (playing === 'phone') { stopPhone(); return; }
    if (playing) { await act('/stop'); setPlaying(null); }
    buzz();
    try {
      if (!audioReady || audioFor !== ed.id) { toast('Loading audio…'); await preloadAudio(ed.id); }
      else await audioReady;
      player.currentTime = ed.start;
      await player.play();
      setPlaying('phone');
      const tick = () => {
        if (!ed || playing !== 'phone') return;
        ed.playhead = player.currentTime;
        if (player.currentTime >= ed.end || player.ended) { stopPhone(); return; }
        draw(); raf = requestAnimationFrame(tick);
      };
      tick();
    } catch (e) {
      toast(e.name === 'NotAllowedError' ? 'Tap again to play' : 'Phone preview failed: ' + e.message);
    }
  };

  async function saveTrim(asCopy) {
    if (!ed) return;
    const r = await act('/clips/' + ed.id + '/trim', { ...range(), name: $('name').value.trim() || null, asCopy });
    if (r && r.ok) { audioFor = null; audioReady = null; await loadClips(); closeEditor(); }
  }
  $('saveTrim').onclick = () => saveTrim(false);
  $('saveCopy').onclick = () => saveTrim(true);
  $('del').onclick = async () => {
    if (!ed || !confirm('Delete "' + ($('name').value || 'this clip') + '"? This can\'t be undone.')) return;
    const r = await act('/clips/' + ed.id + '/delete');
    if (r && r.ok) { await loadClips(); closeEditor(); }
  };
  $('back').onclick = closeEditor;

  // ---------------------------------------------------------------- header buttons + polling
  $('stop').onclick = () => { stopPhone(); setPlaying(null); act('/stop'); };
  $('mute').onclick = () => act('/mic/toggle-mute');

  if (!token) showUnpaired();
  else {
    refreshState();
    // Poll faster while editing so the Stop buttons revert promptly when playback ends.
    let last = 0;
    setInterval(() => {
      const every = document.body.classList.contains('editing') ? 600 : 1500;
      if (!document.hidden && paired && Date.now() - last >= every) { last = Date.now(); refreshState(); }
    }, 300);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshState(); });
  }
})();
</script>
</body>
</html>
